# One-Klick-Setup Baustein 1: bei jedem Tag vX.Y.Z erst Tests, dann das
# Multi-Arch-Image auf ghcr.io. Nie "latest": Freunde-Instanzen nennen feste
# Versionen (Spec 2026-10-04).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag gleich Version in pyproject.toml
        run: |
          version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: S3-Speicher fuer die Speichertests (feste Entwicklungswerte wie docker-compose.yml)
        run: |
          docker run -d --name s3 -p 9000:7070 \
            -e ROOT_ACCESS_KEY=vorlesezeit -e ROOT_SECRET_KEY=vorlesezeit-dev-secret \
            --entrypoint sh \
            versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            -c 'mkdir -p /data/vorlesezeit-test && exec versitygw --health /health posix /data'
          for i in $(seq 60); do curl -sf http://localhost:9000/health && exit 0; sleep 1; done
          docker logs s3; exit 1
      # Tests im Basis-Image der App: dasselbe ffmpeg wie in Produktion
      # (Ubuntus ffmpeg 6.1 meldet im loudnorm-Messlauf keine Dauer).
      - name: Lint und Tests
        run: |
          docker run --rm --network host -v "$PWD:/w" -w /w python:3.12-slim sh -ec '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
            pip install -q -e ".[dev]"
            ruff check .
            ruff format --check app tests scripts
            pytest -q'

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/vorlesezeit
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
