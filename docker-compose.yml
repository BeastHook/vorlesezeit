# Lokaler Beweis fuer U1: App + S3-kompatibler Objektspeicher (versitygw).
# Ersetzt keinen echten Zielort -- siehe U1-Plan, Abschnitt "Zielort".
name: vorlesezeit
services:
  s3:
    # versitygw statt MinIO (MinIO-Images sind seit 2026-10 nicht mehr
    # oeffentlich ladbar). Legt die Aufnahmen als normale Dateien unter
    # /data/<bucket> ab; der Bucket ist ein Verzeichnis, mkdir legt ihn an.
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["sh", "-c", "mkdir -p \"/data/$$STORAGE_BUCKET\" && exec versitygw --health /health posix /data"]
    # KTD17: der Browser braucht den Speicher nicht (Audio laeuft durch die
    # App). Nur auf der Loopback-Schnittstelle, fuer die Tests
    # (tests/test_storage.py) vom Entwicklerrechner aus.
    ports:
      - "127.0.0.1:9000:7070"
    environment:
      ROOT_ACCESS_KEY: vorlesezeit
      ROOT_SECRET_KEY: vorlesezeit-dev-secret
      STORAGE_BUCKET: vorlesezeit-test
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/health"]
      interval: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_TIMEZONE: Europe/Berlin
      STORAGE_ENDPOINT_URL: http://s3:7070
      STORAGE_ACCESS_KEY: vorlesezeit
      STORAGE_SECRET_KEY: vorlesezeit-dev-secret
      STORAGE_BUCKET: vorlesezeit-test
      STORAGE_REGION: us-east-1
      # SQLite-Datei in einem eingebundenen Verzeichnis (KTD12) -- siehe
      # das db-data-Volume unten.
      DATABASE_PATH: /data/vorlesezeit.db
      SESSION_SECRET_KEY: vorlesezeit-dev-session-secret
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      MAGIC_LINK_VALID_UNTIL: "2026-12-31"
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: "587"
      SMTPUSER: ${SMTPUSER:-}
      SMTPPW: ${SMTPPW:-}
      SMTP_FROM_ADDRESS: ${SMTPUSER:-}
      TONIE_USERNAME: ${TONIE_USERNAME:-}
      TONIE_PASSWORD: ${TONIE_PASSWORD:-}
      TONIE_DELIVERY_TIME: ${TONIE_DELIVERY_TIME:-20:00}
      TRIGGER_SECRET: ${TRIGGER_SECRET:-}
      # Mehrkalender U3 (KTD4): Fernet-Schluessel fuer die Passwoerter in der
      # DB. SMTP-/tonies-/Terminwerte oben sind nur Startwerte (R28), einmal
      # uebernommen, danach pflegt sie das Setup.
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
    volumes:
      - db-data:/data
    depends_on:
      s3:
        condition: service_healthy

volumes:
  s3-data:
  db-data:
