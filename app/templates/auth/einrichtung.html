{% extends "auth/_base.html" %}
{% block title %}Einrichtung{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Einrichtung</h2>
  <p>Mit diesem Link meldest du dich einmalig als Organisator an und kommst direkt zur Einrichtung.</p>
  <form method="post" action="/einrichtung/{{ token }}">
    <button type="submit" class="btn btn-primary btn-block">Anmelden und einrichten</button>
  </form>
  <p class="meta">Der Link gilt 24 Stunden und nur einmal.</p>
</div>
{% endblock %}
