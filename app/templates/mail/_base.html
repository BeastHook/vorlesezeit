{% macro knopf(href, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:18px 0;width:100%"><tr><td align="center" bgcolor="#b5412c" style="border-radius:24px">
<a href="{{ href }}" style="display:block;padding:14px 22px;font-family:Figtree,Arial,sans-serif;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:24px">{{ label }}</a>
</td></tr></table>
{%- endmacro %}
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f7efe1">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f7efe1"><tr><td align="center" style="padding:28px 14px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#fffaf1;border-radius:16px"><tr><td style="padding:30px 26px;font-family:Figtree,Arial,sans-serif;font-size:16px;line-height:1.6;color:#2a2018">
{% if ornament_cid %}<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="padding:0 0 10px"><img src="cid:{{ ornament_cid }}" alt="" width="64" height="64" style="display:block;border:0"></td></tr></table>{% endif %}
{% if heading %}<h1 style="margin:0 0 16px;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;line-height:1.2;color:#2f4a3a;text-align:center">{{ heading }}</h1>{% endif %}
{% block body %}{% endblock %}
</td></tr></table>
</td></tr></table>
</body></html>
