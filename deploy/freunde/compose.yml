# Vorlesezeit für befreundete Organisatoren (One-Klick-Setup, Spec 2026-10-04).
# Der Installer legt diese Datei mit einer .env daneben ab; von Hand nicht
# nötig. Feste Versionen, nie "latest": ein Update ändert nur
# VORLESEZEIT_IMAGE in der .env. Kein Port nach außen, kein Docker-Socket:
# erreichbar nur über den Cloudflare Tunnel.
name: vorlesezeit

x-storage-env: &storage-env
  STORAGE_ENDPOINT_URL: http://s3:7070
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY fehlt}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY fehlt}
  STORAGE_BUCKET: vorlesezeit
  STORAGE_REGION: us-east-1

services:
  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    # Der Bucket ist ein Verzeichnis; mkdir legt ihn an, kein eigener Dienst
    # mit Client noetig. $$: die Shell im Container setzt den Wert ein.
    entrypoint: ["sh", "-c", "mkdir -p \"/data/$$STORAGE_BUCKET\" && exec versitygw --health /health posix /data"]
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY fehlt}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY fehlt}
      STORAGE_BUCKET: vorlesezeit
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/health"]
      interval: 10s
      retries: 6

  app:
    image: ${VORLESEZEIT_IMAGE:?VORLESEZEIT_IMAGE fehlt}
    restart: unless-stopped
    depends_on:
      s3:
        condition: service_healthy
    environment:
      <<: *storage-env
      APP_TIMEZONE: Europe/Berlin
      DATABASE_PATH: /data/vorlesezeit.db
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY fehlt}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL fehlt}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTPUSER: ${SMTPUSER:-}
      SMTPPW: ${SMTPPW:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      TRIGGER_SECRET: ${TRIGGER_SECRET:?TRIGGER_SECRET fehlt}
      BACKUP_MARKER_PATH: /backup-marker/last-success
    volumes:
      - db-data:/data
      - backup-marker:/backup-marker:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN fehlt}

  scheduler:
    image: ${VORLESEZEIT_IMAGE:?VORLESEZEIT_IMAGE fehlt}
    command: ["python", "deploy/scheduler/scheduler.py"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TRIGGER_SECRET: ${TRIGGER_SECRET:?TRIGGER_SECRET fehlt}

  backup:
    image: ${VORLESEZEIT_IMAGE:?VORLESEZEIT_IMAGE fehlt}
    command: ["python", "deploy/backup/backup.py"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      <<: *storage-env
      DATABASE_PATH: /data/vorlesezeit.db
      BACKUP_TARGET_DIR: /backup
      BACKUP_MARKER_PATH: /backup-marker/last-success
    volumes:
      - db-data:/data
      - backup-marker:/backup-marker
      - ${BACKUP_TARGET_PATH:?BACKUP_TARGET_PATH fehlt}:/backup

volumes:
  db-data:
  s3-data:
  backup-marker:
